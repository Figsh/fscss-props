<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>fscss-props · reactive proxy state</title>
  <script src="../fscss-props.js"></script>
  <style>
    * {
      box-sizing: border-box;
    }
    body {
      m: 0;
      min-h: 100vh;
      p: 24px;
      bg: #0b1020;
      color: #e6edf7;
      ff: system-ui, sans-serif;
    }
    .wrap {
      max-w: 640px;
      mx: auto;
      stack: 20px;
    }
    h1 {
      fs: 20px;
      m: 0;
    }
    .card {
      p: 20px;
      rounded: 16px;
      bg: #121a30;
      border: 1px solid #22304f;
      stack: 12px;
    }
    .item {
      p: 14px;
      rounded: 12px;
      bg: #1b2745;
      hstack: 12px;
      ai: center;
      trans: background-color 0.15s, transform 0.15s;
    }
    .item.active {
      bg: #312e81;
    }
    .dot { 
      size: 12px; 
      rounded: 50%; 
      shrink: 0; 
    }
    .grow {
      flex: 1; 
      fs: 14px;
    }
    button {
      px: 12px;
      py: 6px;
      rounded: 8px;
      border: 1px solid #2c3d66;
      bg: #1b2745;
      color: inherit;
      font: inherit;
      cur: pointer;
    }
    button:hover {
      bg: #25365f;
    }
    .layout { /* switched via fscssPropText */ }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>Reactive state → list styles</h1>
    <div class="card">
      <div class="bar" style="hstack: 8px; fwrap: wrap;">
        <button type="button" id="layoutStack">Stack</button>
        <button type="button" id="layoutGrid">Grid</button>
        <button type="button" id="add">Add item</button>
      </div>
      <div class="layout" id="list"></div>
    </div>
  </div>

  <script>
    /** Minimal reactive object: any set triggers listeners */
    function reactive(target, onChange) {
      return new Proxy(target, {
        set(obj, key, value) {
          obj[key] = value;
          onChange(obj, key, value);
          return true;
        },
      });
    }

    const listEl = document.getElementById('list');
    const colors = ['#6366f1', '#0ea5e9', '#10b981', '#f59e0b', '#ec4899'];

    const state = reactive(
      {
        layout: 'stack: 10px',
        items: [
          { id: 1, label: 'Inbox', active: true },
          { id: 2, label: 'Drafts', active: false },
          { id: 3, label: 'Archive', active: false },
        ],
      },
      () => render()
    );

    function render() {
      listEl.fscssPropText = state.layout;

      listEl.innerHTML = state.items
        .map(
          (item, i) => `
        <div class="item" data-id="${item.id}">
          <span class="dot" style="bg: ${colors[i % colors.length]}"></span>
          <span class="grow">${item.label}</span>
          <button type="button" data-act="toggle">Toggle</button>
        </div>`
        )
        .join('');

      listEl.querySelectorAll('.item').forEach((node) => {
        const id = +node.dataset.id;
        const item = state.items.find((x) => x.id === id);
        if (item?.active) node.classList.add('active');
        // per-row emphasis via fscss props
        if (item?.active) {
          node.fscssProp.shadow = 'inset 3px 0 0 #a5b4fc';
        } else {
          node.fscssProp.shadow = null;
        }
      });
    }

    listEl.addEventListener('click', (e) => {
      const btn = e.target.closest('[data-act=toggle]');
      if (!btn) return;
      const row = btn.closest('.item');
      const id = +row.dataset.id;
      // immutable-style update so Proxy sees .items assignment
      state.items = state.items.map((it) =>
        it.id === id ? { ...it, active: !it.active } : it
      );
    });

    document.getElementById('layoutStack').onclick = () => {
      state.layout = 'stack: 10px';
    };
    document.getElementById('layoutGrid').onclick = () => {
      state.layout = 'cols: 2; gap: 10px';
    };
    document.getElementById('add').onclick = () => {
      const id = Date.now();
      state.items = [
        ...state.items,
        { id, label: 'Item ' + id.toString().slice(-4), active: false },
      ];
    };

    render();
  </script>
</body>
</html>
